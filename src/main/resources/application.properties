spring.application.name=miApiUsuario

spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=${DB_DRIVER}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=${DB_DIALECT}
spring.jpa.hibernate.ddl-auto=${DB_DDL}

spring.h2.console.enabled=${DB_CONSOLE}
spring.h2.console.path=${DB_CONSOLE_PATH}
